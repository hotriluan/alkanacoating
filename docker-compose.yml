version: "3.9"

services:
  app:
    build:
      context: ./infra/php
      dockerfile: Dockerfile
    container_name: alkanacoating-app
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
      - ./overlay:/opt/overlay:ro
      - ./:/workspace
      - ./infra/php/php.ini:/usr/local/etc/php/php.ini
    environment:
      - APP_ENV=local
    depends_on:
      - db

  web:
    image: nginx:1.25-alpine
    container_name: alkanacoating-web
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www/html
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: alkanacoating-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: alkanacoating
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: app
      MYSQL_PASSWORD: app
    ports:
      - "3307:3306"
    volumes:
      - dbdata:/var/lib/mysql

volumes:
  dbdata:
    driver: local
