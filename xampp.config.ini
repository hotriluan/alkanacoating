###############################################
# ALKANA COATING - XAMPP CONFIGURATION
###############################################

[xampp]
# Cấu hình mặc định cho XAMPP

# Apache
apache_port=80
apache_ssl_port=443

# MySQL
mysql_port=3306
mysql_user=root
mysql_password=

# Database
database_name=alkanacoating
database_charset=utf8mb4
database_collation=utf8mb4_unicode_ci

# PHP Settings
php_version=8.0+
php_memory_limit=256M
php_upload_max_filesize=8M
php_post_max_size=10M
php_max_execution_time=300
php_max_input_time=300

# Application
app_name=Alkana Coating
app_env=production
app_debug=false
app_url=http://localhost/alkana

# Admin Defaults
admin_name=Administrator
admin_email=admin@alkanacoating.com
admin_password=admin123

# Paths
install_path=C:/xampp/htdocs/alkana
document_root=/alkana
backend_path=/backend
frontend_path=/frontend
public_path=/backend/public
storage_path=/backend/storage
uploads_path=/backend/public/uploads

###############################################
# CÁC BƯỚC CÀI ĐẶT TỰ ĐỘNG
###############################################

# 1. Kiểm tra PHP version >= 8.0
# 2. Kiểm tra PHP extensions: mysqli, pdo, mbstring, openssl, gd, zip
# 3. Tạo database tự động
# 4. Import schema và seed data
# 5. Tạo file .env tự động
# 6. Generate APP_KEY
# 7. Run migrations
# 8. Tạo admin user
# 9. Build frontend (hoặc sử dụng build có sẵn)
# 10. Cấu hình Apache .htaccess
# 11. Set permissions cho storage và cache
# 12. Tạo file installed.lock

###############################################
# YÊU CẦU HỆ THỐNG TỐI THIỂU
###############################################

[requirements]
php_min_version=8.0.0
mysql_min_version=8.0.0
apache_min_version=2.4.0
disk_space_min=500MB
memory_min=256MB

# PHP Extensions Required
php_extensions=mysqli,pdo,pdo_mysql,mbstring,openssl,json,zip,gd,fileinfo,tokenizer,xml,ctype,curl

# PHP Extensions Optional
php_extensions_optional=redis,imagick,opcache

###############################################
# BẢO MẬT SAU CÀI ĐẶT
###############################################

[security]
# Sau khi cài đặt xong:
# 1. Xóa hoặc đổi tên file installer.php
# 2. Đổi mật khẩu admin mặc định
# 3. Cấu hình email SMTP
# 4. Bật HTTPS nếu có SSL
# 5. Review file .htaccess
# 6. Set APP_DEBUG=false
# 7. Clear cache: php artisan cache:clear

###############################################
# TROUBLESHOOTING
###############################################

[troubleshooting]

# Lỗi: Database connection refused
# Fix: Kiểm tra MySQL đã chạy trong XAMPP Control Panel

# Lỗi: Permission denied on storage
# Fix (Windows): Bỏ qua, hoặc chạy XAMPP as Administrator

# Lỗi: Class not found
# Fix: Chạy: composer install (nếu có composer)
# Hoặc: Sử dụng vendor folder có sẵn

# Lỗi: Frontend không hiển thị
# Fix: Kiểm tra folder frontend/dist có build chưa
# Hoặc: Build lại: npm run build

# Lỗi: 404 Not Found
# Fix: Kiểm tra mod_rewrite đã bật trong httpd.conf
# AllowOverride All trong Directory directive

###############################################
# CONTACT & SUPPORT
###############################################

[support]
email=support@alkanacoating.com
github=https://github.com/yourname/alkanacoating
docs=http://localhost/alkana/docs
